[package]

name = "blockchain_rust"
authors = [""]
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ring = "0.17.13"
data-encoding = "2.8.0"
num-bigint = "0.4.6"
sled = "0.34.7"
serde = { version = "1.0.218", features = ["derive"] }
bincode = "1.3.3"
structopt = "0.3.26"
clap = "4.5.31"
rust-crypto = "0.2.35"
bs58 = "0.5.0"
rustc-serialize = "0.3.25"
uuid = { version = "1.15.0", features = ["v4"]}
log = "0.4.26"
env_logger = "0.11.6"
serde_json = "1.0.140"
once_cell = "1.9.0"

[dev-dependencies]
assert_cmd = "2.0.16"

